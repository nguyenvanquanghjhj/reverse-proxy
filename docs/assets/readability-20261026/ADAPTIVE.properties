# Java 21; third backend field is service concurrency (NOT the old WRR weight).
proxy.bind.host=127.0.0.1
proxy.port=8080
backend.servers=127.0.0.1:9001:8,127.0.0.1:9002:8,127.0.0.1:9003:8
loadbalancer.strategy=ADAPTIVE

healthcheck.path=/health
healthcheck.interval.ms=500
healthcheck.timeout.ms=500
healthcheck.recovery.successes=2
metrics.path=/metrics
metrics.stale.ms=3000

adaptive.ewma.alpha=0.2
adaptive.initial.latency.ms=50
adaptive.warmup.ms=5000
adaptive.exploration.interval=50
# Keep only the latest Adaptive decision, including candidate scores and exclusions.
adaptive.decision-trace.enabled=false

proxy.max.inflight=128
# Includes incomplete header parsing; no executor queue. Rejected connections close before HTTP handling.
proxy.max.handler.tasks=144
backend.max.inflight=64
proxy.max.body.bytes=1048576
proxy.max.header.bytes=32768
proxy.max.header.count=100
# Tổng byte size/extension, CRLF và trailer của response chunked; không tính payload.
proxy.max.chunk.metadata.bytes=65536
proxy.shutdown.grace.seconds=2
proxy.connect.timeout.ms=500
proxy.read.timeout.ms=3000
proxy.request.timeout.ms=5000

# Consecutive backend failures (transport, timeout, 5xx or upstream 429).
proxy.circuit-breaker.enabled=true
proxy.circuit-breaker.failure-threshold=5
proxy.circuit-breaker.open-duration.ms=5000
# This implementation deliberately supports exactly one half-open probe.
proxy.circuit-breaker.half-open-max-probes=1

# Opt in: peer IP only; forwarded headers never establish client identity.
proxy.rate-limit.enabled=false
proxy.rate-limit.requests-per-second=100
proxy.rate-limit.burst=200
proxy.rate-limit.max-clients=4096
# Must be at least burst / requests-per-second * 1000 (safe idle eviction).
proxy.rate-limit.idle.ms=60000

# Optional additional loopback-only listener with an independent bounded executor.
# Existing /__proxy/* routes on the data port remain compatible.
proxy.management.enabled=false
proxy.management.port=9090
proxy.management.max.handler.tasks=16

# Reserved flag: true fails startup explicitly; no partial pooling implementation.
proxy.connection-pool.enabled=false

proxy.port=56782
backend.servers=127.0.0.1:55597:8,127.0.0.1:55598:8,127.0.0.1:55599:8
loadbalancer.strategy=ADAPTIVE
adaptive.decision-trace.enabled=true
