name: Java 21 and benchmark correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -ntp clean verify
      - run: python -m pip install -r tools/requirements-charts.txt
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python tools/check_reports.py --include-defense
      - run: python tools/defense_artifacts.py --verify benchmarks/defense/20261021
      - run: git diff --check
      - name: Smoke benchmark and verify artifacts
        shell: bash
        run: |
          python scripts/benchmark.py --quick --requests 12 --warmup-requests 6 --scenarios homogeneous --output benchmarks/results/ci-smoke
          python scripts/verify_benchmark.py benchmarks/results/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            target/test-reports/
            benchmarks/results/ci-smoke/
