name: Java 21 and benchmark correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -ntp clean verify
      - name: Standalone tests on Windows
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1
      - name: Standalone tests on Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Fresh source build isolated from IDE output
        run: python tools/verify_clean_build.py
      - run: python -m pip install -r tools/requirements-charts.txt
      - run: python scripts/ci_python_tests.py
      - run: python tools/check_reports.py --include-defense
      - run: python tools/defense_artifacts.py --verify benchmarks/defense/20261021
      - name: Verify independent ablation evidence when present
        if: hashFiles('benchmarks/ablation/20261026/archive-manifest.json') != ''
        run: python tools/ablation.py --verify-archive benchmarks/ablation/20261026
      - run: git diff --check
      - name: Smoke benchmark and verify artifacts
        shell: bash
        run: |
          python scripts/benchmark.py --quick --requests 12 --warmup-requests 6 --scenarios homogeneous --output benchmarks/results/ci-smoke
          python scripts/verify_benchmark.py benchmarks/results/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            target/test-reports/
            target/clean-build-check/verification.json
            target/clean-build-check/build-*.log
            benchmarks/results/ci-smoke/
